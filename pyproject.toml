[project]
name = "component-aws-cost-and-usage-reports"
version = "1.1.3"
description = "AWS Cost and Usage Reports component for Keboola - DuckDB version"
authors = [
    {name = "Keboola", email = "support@keboola.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "duckdb>=0.10.0,<2.0.0",
    "keboola.component>=1.6.10",
    "boto3>=1.34.0,<2.0.0",
    "botocore>=1.34.0,<2.0.0",
    "dateparser>=1.2.0",
    "pytz>=2024.1",
    "regex>=2024.0.0",
    "flake8>=7.3.0",
    "mock>=4.0.0",
    "freezegun>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "mock>=4.0.0",
    "freezegun>=1.2.0",
    "flake8>=7.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
