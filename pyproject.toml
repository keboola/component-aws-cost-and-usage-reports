[project]
name = "keboola-aws-cost-and-usage-reports"
version = "1.1.3"
description = "Keboola AWS Cost and Usage Reports Extractor"
requires-python = ">=3.10,<3.11"

dependencies = [
    "kbc @ https://bitbucket.org/kds_consulting_team/keboola-python-util-lib/get/0.4.4.zip",
    "requests>=2.28.0",
    "mock",
    "freezegun",
    "boto3>=1.26.0,<2.0.0",
    "botocore>=1.29.0,<2.0.0",
    "SQLAlchemy>=1.4.0,<2.0.0",
    "snowflake-connector-python>=2.9.0,<3.0.0",
    "snowflake-sqlalchemy>=1.4.0,<2.0.0",
    "dateparser>=1.0.0",
    "pytz>=2022.6",
    "regex>=2022.3.2",
]

[project.optional-dependencies]
dev = [
    "flake8",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"
